name: 功能建议
description: 提出一个新能力或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个面板的边界很明确：**一台机器一个入口，直接管理宿主机原生能力，不用 Docker。**
        跨机聚合、容器编排、多租户不属于它的设计范围——如果你想要的是这些，先说清场景，我们可以讨论是否放得进来。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 用场景描述，而不是直接给方案。"我每周要手工做 X"比"请加一个 Y 按钮"更有用
      placeholder: |
        每次改 nginx 站点都要 SSH 上去核对配置文件名，容易漏掉一个 vhost。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 页面/CLI 各自怎么呈现；若涉及新配置项，给出变量名与默认值
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过
      description: 手工命令、外部工具，或者干脆放弃这个需求
      placeholder: 目前只能 choyeonctl doctor 之后自己 ssh 看 /etc/nginx/conf.d/

  - type: dropdown
    id: surface
    attributes:
      label: 涉及的层面
      description: 可多选的判断依据：改哪个就得测哪个
      options:
        - 后端 API / service 层
        - CLI（choyeonctl）
        - 前端页面
        - 安装与部署脚本
        - doctor 自检项
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 不需要引入 Docker 或额外的常驻守护进程
          required: true
        - label: 在单实例管单机的前提下成立（不是跨机聚合需求）
          required: true
