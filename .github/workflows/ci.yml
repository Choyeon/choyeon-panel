name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main 上"新提交赢"本身没错，错的是下面这一步没有上限。单元测试会卡死（CI 上实测 55 分钟
  # 不退出，而本机 2 核 2m32s 跑完），于是一个 run 永远赶不到下一次 push 之前跑完：近 40 个
  # run 全部 cancelled，最后一次 success 停在 2026-10-13（2c6c5b4），交付说明里的"CI 已确认"
  # 确认的都不是当次代码。保留抢消，改的是两处超时——让卡住在 25 分钟变成一次带日志的失败，
  # 而不是烧满 6 小时后被静默取消。改成排队的话，那个 6 小时的僵尸 run 会挡住后面每一批。
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端（Python ${{ matrix.py }}）
    runs-on: ubuntu-latest
    # 没有上限就等于"卡住也不会告诉任何人"：单元测试那步另有更紧的 25 分钟（真会卡的地方
    # 在那儿），这里兜住 CLI 冒烟与启动冒烟，别让它们默默烧满 GitHub 的 6 小时默认值。
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          # 测试依赖与生产依赖分开：starlette 1.x 的 TestClient 硬依赖 httpx2，
          # 干净环境缺它会 RuntimeError（本地 venv 有旧 httpx 只报 warning，
          # 所以本地绿不代表 CI 绿）
          # 这一份清单是 CI 与开发机唯一的差异来源：原来这里还内联 `pip install ruff mypy`，
          # 于是 CI 装的工具集和服务器 venv 各自一套，"本地复现 CI"这句话没有落点。
          # 现在 ruff / mypy / pip-audit 一律来自 requirements-dev.txt。
          python -m pip install -q -r requirements-dev.txt

      - name: 语法编译
        run: python -m compileall -q app tests

      - name: Ruff 静态检查
        run: ruff check --output-format=github .

      - name: Mypy 类型检查（提示性，不阻断）
        # 只有 continue-on-error 这一层降级：`run: mypy app || true` 在它之上再把退出码
        # 抹成 0，日志里连"这一步其实没通过"都读不出来。它是提示项，不是门，
        # 但提示项的失败必须看得见。
        continue-on-error: true
        run: mypy app

      - name: 依赖漏洞审计（后端）
        # 阻断项：面板以 root 跑在这台机器上，requirements.txt 里一个已知 CVE 就是本机入口。
        # 按本仓库的规矩，"没核对成"不许当绿灯——pip-audit 拿不到漏洞源时非零退出，
        # 这一步就跟着红，而不是跳过审计后宣布通过。
        run: pip-audit -r requirements.txt

      - name: 单元测试
        # 本机 2 核跑完 run_tests.py 实测 2m32s，而 CI 上这一步跑到 55 分钟仍不退出
        # （2026-10-17，run 38978654102）——不是慢，是卡住。给 25 分钟上限：超时算 FAIL，
        # 下一步把 ut.log 尾部贴成 GitHub 注解，卡在哪一条测试从此看得见；没有上限的话它
        # 一路烧到 6 小时默认值，中途还被下一次 push 静默取消，后端 verdict 就是这么消失的。
        timeout-minutes: 25
        # run_tests.py 是 unittest 入口：强制把 CP_DATA_DIR 指向会话临时目录并在退出时
        # 清理（unittest 不读 conftest.py，缺这两道保护会污染真实数据目录、在 /tmp 留残留）
        run: |
          set -o pipefail
          python run_tests.py -v 2>&1 | tee "${{ runner.temp }}/ut.log"
      # unittest 不产 GitHub 注解，失败时把失败头与异常行转成 ::error，
      # 这样不用登录就能从 API 读到失败点（公开仓库注解是公开的）。
      - name: 单元测试失败摘要
        if: failure()
        # 这一步在 ut.log 为空时会重跑整套测试（卡住的那套），所以它自己必须有上限：
        # 没有上限的诊断步骤本身就是一个新的 6 小时黑洞。
        timeout-minutes: 15
        run: |
          LOG="${{ runner.temp }}/ut.log"
          if [ ! -s "$LOG" ]; then
            echo "::error ::ut.log missing or empty"
            python run_tests.py > /tmp/re.log 2>&1 || true
            LOG=/tmp/re.log
          fi
          echo "::error ::log-lines=$(wc -l < "$LOG")"
          grep -E "^(FAIL|ERROR): " "$LOG" | head -8 | sed "s/^/::error ::/" || true
          # 只有名字等于还是看不见：unittest 的 traceback 在 "ERROR: xxx" 那行往下十几行，
          # 而日志尾部被后面的 CLI 冒烟输出盖掉，tail -80 根本够不着它（2026-10-20 run
          # 39398186981 就是这样：摘要里只有 "ERROR: test_the_gate_actually_bites"，
          # 是超时、是权限、还是断言，全靠猜）。按名字往下取，才叫失败摘要。
          TB="$(grep -A 22 -E '^(FAIL|ERROR): ' "$LOG" | head -80 | tr '\n' '|' | head -c 3500)"
          if [ -n "$TB" ]; then
            echo "::error ::traceback=$TB"
          fi
          rm -f /tmp/chunk_*
          tail -80 "$LOG" | split -l 20 - /tmp/chunk_
          i=0
          for f in /tmp/chunk_*; do
            i=$((i+1)); [ $i -gt 9 ] && break
            echo "::error ::$(tr '\n' '|' < "$f" | head -c 3500)"
          done
          rm -f /tmp/chunk_*

      - name: CLI 冒烟（choyeonctl）
        env:
          CP_DATA_DIR: ${{ runner.temp }}/cp-cli
        run: |
          python cli.py schema --json > /dev/null
          python cli.py app templates
          # 口令当场生成、只走标准输入：AGENTS.md 第 7 条把 --password 列为禁止写法（argv 里的
          # 口令同机用户 ps 可见、还留在 shell 历史），CI 原来却一直用被禁的那条——
          # 于是文档里唯一的正规入口在 CI 从没被跑过，写坏了也没人知道。
          PW="$(python -c 'import secrets,string;print("".join(secrets.choice(string.ascii_letters+string.digits) for _ in range(20)))')"
          printf '%s' "$PW" | python cli.py user create ci-admin --password-stdin --json
          python cli.py user list
          python cli.py status --json || true
          python cli.py doctor || true

      - name: 启动冒烟测试
        env:
          CP_PORT: '3999'
          CP_HOST: 127.0.0.1
          CP_DATA_DIR: ${{ runner.temp }}/cp-smoke
        run: |
          python -m app.main &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/api/health | grep -q '"ok":true'; then
              echo "health ok"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3999/api/health
          curl -fsS -D - -o /dev/null http://127.0.0.1:3999/api/auth/status | grep -i 'x-content-type-options'
          kill $PID

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    # 没有 job 级上限时，npm ci / vite build 卡住会一路烧到 GitHub 的 6 小时默认值，
    # 再被下一次 push 静默取消——和后端 verdict 当初消失的原因是同一个。
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --fund=false

      - name: 依赖漏洞审计（前端）
        # `npm ci --no-audit` 关掉了安装期的隐式审计，这条把它显式补回来并让它阻断。
        # 阈值 high：2026-10-20 实测唯一已知项是 echarts 的 moderate XSS（GHSA-fgmj-fm8m-jvvx，
        # 修它要跨 echarts 大版本，属破坏性升级，另开批次处理），把它算成红只会让这条门
        # 在第二天被 `|| true` 按住——门的价值首先是"今天就能通过并且真的会红"。
        # 这道门确实在第二天红过：2026-10-24 一批 vite 公告（GHSA-587h-7wmj-h5pm 等，
        # 影响 <=6.4.3）把它压红。vite 只是 devDependency，公告说的是开发服务器与
        # launch-editor，不在生产链路里——但 CI 装的就是这份 lock，所以处置是把它升到
        # 同大版本的补丁 6.4.5（lock 里两行），而不是放宽阈值或 `|| true`。
        run: npm audit --audit-level=high

      - name: 单元测试（composable 时序回归）
        # Node 22.18+ 默认按类型擦除跑 .ts；--experimental-strip-types 让 22.6~22.17
        # 的 runner 同样能跑，别让这条静默不执行。
        # 这条必须跑在构建前面：批次㊸ useCachedFetch 绑死 dead 条目导致全站
        # 「写完不刷新」，typecheck 与 vite build 全绿，只有真时序用例能抓到。
        run: npm run test:unit

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  shell:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh
      - name: Bash 语法检查
        run: for f in scripts/*.sh; do bash -n "$f"; done

  systemd:
    name: systemd unit 校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: systemd-analyze verify（校验真正会装上去的那份 unit）
        # 旧写法是 `systemd-analyze verify ./deploy/choyeon-panel.service || true`。
        # 模板里写死了 /root/choyeon-panel/backend/.venv/bin/python，任何 runner 上都没有
        # 这个路径，verify 必定报 "Command ... is not executable" 退 1，于是当初用 `|| true`
        # 把它按住——从那一刻起这条门对 unit 的任何真实错误都无感（拼错的指令名、
        # 无效的执行行、写坏的 cgroup 上限，全都会绿）。
        # 2026-10-20 在生产机上实测同一份 unit：可执行文件缺失时 rc=1，补齐后 rc=0，
        # 证明那个 1 从来只是路径缺失，不是 unit 有问题——门可以真的阻断。
        # 现在校验的是 render_unit 渲染出来的那份（部署时装上去的就是它），
        # 而不是模板原文：验的和装上去的必须是同一个文件。
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/unit-check"
          # 伪造一个"安装目录"：render_unit 会把模板里的 /root/choyeon-panel 换成 $PREFIX，
          # 这里让那个前缀真实存在，ExecStart 指向的解释器也造出来，
          # 剩下的报错就只可能是 unit 本身的问题。
          mkdir -p "$ROOT/repo/deploy" "$ROOT/repo/backend/.venv/bin" "$ROOT/repo/data"
          cp deploy/choyeon-panel.service "$ROOT/repo/deploy/"
          printf '#!/bin/sh\nexit 0\n' > "$ROOT/repo/backend/.venv/bin/python"
          chmod +x "$ROOT/repo/backend/.venv/bin/python"
          UNIT_OUT="$ROOT/choyeon-panel.service"
          # 覆盖 UNIT_FILE 必须发生在 source 之后：common.sh 第 77 行无条件把它赋成
          # /etc/systemd/system/...，非 root 的 runner 在 source 前传环境变量进去会被盖掉，
          # 于是渲染直接写不进临时目录。
          CP_PREFIX="$ROOT/repo" bash -c '
            source scripts/common.sh >/dev/null 2>&1
            UNIT_FILE="$1"
            render_unit >/dev/null
          ' _ "$UNIT_OUT"
          test -s "$UNIT_OUT"
          # render_unit 把模板里的 /root/choyeon-panel 换成 $PREFIX（就是 $ROOT/repo），
          # 断言指着那个前缀，才证明校验的确实是渲染后的这份而不是模板。
          grep -q "^ExecStart=$ROOT/repo/backend/\.venv/bin/python" "$UNIT_OUT"
          # verify 的退出码不够用：2026-10-20 在生产机上实测，MemoryMax=512Q 与
          # Restart=maybe 都只打印一句"ignoring"然后退 0——写错的 cgroup 上限照样"通过"。
          # 所以任何输出都算失败，只放行 runner 的 systemd 版本比生产旧造成的 Unknown key
          # （那不是 unit 的错，是 runner 的）。
          RC=0
          OUT="$(systemd-analyze verify "$UNIT_OUT" 2>&1)" || RC=$?
          if [ -n "$OUT" ]; then
            printf '%s\n' "$OUT"
            if printf '%s\n' "$OUT" | grep -qiv "Unknown key"; then
              echo "::error ::unit 校验有告警以上输出（见上），修好再合"
              exit 1
            fi
            echo "只有版本差异造成的 Unknown key，按通过处理"
          fi
          [ "$RC" -eq 0 ] || { echo "::error ::systemd-analyze verify 退 $RC"; exit "$RC"; }
