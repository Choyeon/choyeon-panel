name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的目标 tag（须已存在）
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    # 没有上限的发布 job 卡住时，既不出产物也不报错，只会在 6 小时后被取消；
    # tag 触发的那次发布从此"没有下文"，而没人会去猜是 npm ci 还是 tar 挂住了。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci --no-audit --fund=false
          npm run build

      - name: 打包（不含 node_modules / .venv / data）
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          # 产物先写到工作区外：tar 读 "." 时，目录里新增的归档文件会让 tar
          # 判定 "." 已变化而以退出码 1 失败（归档内容本身没问题但步骤挂掉）
          OUT="${{ runner.temp }}/rel-assets"
          mkdir -p "$OUT"
          tar --exclude='.git' --exclude='node_modules' --exclude='.venv' \
              --exclude='data' --exclude='web/dist' \
              -czf "$OUT/choyeon-panel-${VERSION}.tar.gz" \
              --transform "s#^#choyeon-panel/#" .
          # 前端构建产物单独打包，供只需替换静态资源的场景使用
          tar -czf "$OUT/choyeon-panel-web-${VERSION}.tar.gz" -C web dist
          # 校验和用文件基名，用户在工作区里 sha256sum -c 才能对上
          ( cd "$OUT" && sha256sum choyeon-panel-*.tar.gz ) > SHA256SUMS.txt
          mv "$OUT"/choyeon-panel-*.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            choyeon-panel-*.tar.gz
            SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            choyeon-panel-*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装

            ```bash
            git clone --branch <本 tag> https://github.com/Choyeon/choyeon-panel.git
            cd choyeon-panel && sudo bash scripts/install.sh      # 就地部署到该目录
            ```

            不想用 git 时，下载源码包 `choyeon-panel-<版本>.tar.gz`，解压后进入目录执行同一条命令。

            ## 已安装实例升级

            ```bash
            sudo choyeonctl upgrade          # 拉代码 → 备份 → 构建 → 重启，健康检查失败自动回滚
            sudo choyeonctl status --json    # healthy 必须为 true
            sudo choyeonctl doctor --json    # counts.fail 必须为 0
            ```

            只改了 `.env` 配置时用 `choyeonctl upgrade --no-pull` 重新渲染 systemd unit。

            ## 产物

            - `choyeon-panel-<版本>.tar.gz` —— 源码包（不含 `.git`、`node_modules`、`.venv`、`data`、`web/dist`）
            - `choyeon-panel-web-<版本>.tar.gz` —— 前端构建产物，解压为 `web/dist` 后可直接由后端托管
            - `SHA256SUMS.txt` —— 校验：`sha256sum -c SHA256SUMS.txt`

            变更明细见 [CHANGELOG.md](https://github.com/Choyeon/choyeon-panel/blob/main/CHANGELOG.md)；部署与排障规则见 [AGENTS.md](https://github.com/Choyeon/choyeon-panel/blob/main/AGENTS.md) / [RUNBOOK.md](https://github.com/Choyeon/choyeon-panel/blob/main/RUNBOOK.md)。
