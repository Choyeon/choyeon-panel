    <line x1="228" y1="64" x2="1200" y2="64" stroke="#434552"/>
    <text x="256" y="39" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e3e6f3">概览</text>
    <text x="324" y="39" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#9597a4">/ 服务器运行状态</text>

    <text x="828" y="39" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#adb0bc"> uptime 128d </text>
