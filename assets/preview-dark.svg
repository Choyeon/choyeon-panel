        <text x="500" y="676" fill="#adb0bc">static-site</text>
        <text x="620" y="676" fill="#adb0bc" font-family="'JetBrains Mono',Menlo,monospace">—</text>
        <circle cx="746" cy="672" r="4" fill="#9597a4"/>
        <text x="758" y="676" fill="#c0c2cf">已停止</text>
        <text x="900" y="676" fill="#3d8eff">日志 · 启动 · 删除</text>
