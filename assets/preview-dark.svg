    <rect x="27" y="29" width="20" height="15" rx="3" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="27" y="32.5" width="6" height="12" fill="#4c8ef1"/>
    <text x="64" y="45" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e3e6f3">choyeon-panel</text>

    <!-- group: 监控 -->
    <text x="20" y="92" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.2" fill="#9597a4">监控</text>

    <!-- active item: 概览 -->
    <rect x="8" y="102" width="212" height="38" rx="10" fill="#3d8eff" fill-opacity="0.14"/>
    <rect x="8" y="112" width="3" height="18" rx="1.5" fill="#3d8eff"/>
    <rect x="24" y="115" width="7" height="7" rx="1.5" fill="#3d8eff"/>
    <rect x="34" y="115" width="7" height="7" rx="1.5" fill="#3d8eff" fill-opacity="0.6"/>
    <rect x="24" y="125" width="7" height="7" rx="1.5" fill="#3d8eff" fill-opacity="0.6"/>
    <rect x="34" y="125" width="7" height="7" rx="1.5" fill="#3d8eff"/>
    <text x="52" y="126" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e3e6f3">概览</text>

    <g font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" fill="#adb0bc">
      <rect x="24" y="153" width="16" height="12" rx="2" fill="none" stroke="#9597a4" stroke-width="1.4"/>
      <text x="52" y="164">应用</text>
      <rect x="24" y="191" width="16" height="16" rx="3" fill="none" stroke="#9597a4" stroke-width="1.4"/>
      <text x="52" y="202">服务</text>
      <ellipse cx="32" cy="232" rx="8" ry="4" fill="none" stroke="#9597a4" stroke-width="1.4"/>
      <path d="M24 232v8c0 2.2 3.6 4 8 4s8-1.8 8-4v-8" fill="none" stroke="#9597a4" stroke-width="1.4"/>
      <text x="52" y="240">数据库</text>
      <rect x="24" y="265" width="16" height="14" rx="2" fill="none" stroke="#9597a4" stroke-width="1.4"/>
      <path d="M24 269h16" stroke="#9597a4" stroke-width="1.4"/>
