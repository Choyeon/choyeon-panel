    <line x1="910" y1="448" x2="1162" y2="448" stroke="#434552"/>
    <rect x="910" y="460" width="252" height="24" rx="7" fill="#6fdba4" fill-opacity="0.12"/>
    <text x="1036" y="476" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#6fdba4">TLS 反代已启用 · 端口未暴露公网</text>

    <!-- ================= app table ================= -->
    <rect x="256" y="518" width="928" height="180" rx="14" fill="#242633" stroke="#434552"/>
    <text x="278" y="548" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e3e6f3">应用</text>
    <text x="340" y="548" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#9597a4">4 个 · 3 运行中</text>
    <rect x="1044" y="528" width="120" height="30" rx="9" fill="url(#pd-brand)"/>
    <text x="1104" y="547" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff">部署新应用</text>

    <g font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#9597a4">
