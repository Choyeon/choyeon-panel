    <rect x="8" y="648" width="212" height="52" rx="12" fill="#242633" stroke="#434552"/>
    <circle cx="30" cy="674" r="9" fill="#6fdba4" fill-opacity="0.16"/>
    <path d="M26 674l3 3 6-6" fill="none" stroke="#6fdba4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
