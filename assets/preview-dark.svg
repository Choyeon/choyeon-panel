<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="choyeon-panel 概览页界面示意">
  <defs>
    <linearGradient id="pd-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005eeb"/>
      <stop offset="1" stop-color="#4c8ef1"/>
    </linearGradient>
    <linearGradient id="pd-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8eff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3d8eff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pd-area2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="pd-screen"><rect x="0" y="0" width="1200" height="720" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#pd-screen)">
    <!-- page -->
    <rect width="1200" height="720" fill="#2e313d"/>

    <!-- ================= sidebar ================= -->
    <rect x="0" y="0" width="228" height="720" fill="#262833"/>
    <line x1="228" y1="0" x2="228" y2="720" stroke="#434552" stroke-width="1"/>

    <!-- brand row -->
