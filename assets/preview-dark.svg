        <text x="278" y="616" fill="#e3e6f3">my-api</text>
        <text x="500" y="616" fill="#adb0bc">python-fastapi</text>
        <text x="620" y="616" fill="#adb0bc" font-family="'JetBrains Mono',Menlo,monospace">8000</text>
        <circle cx="746" cy="612" r="4" fill="#8fd460"/>
        <text x="758" y="616" fill="#c0c2cf">运行中</text>
        <text x="900" y="616" fill="#3d8eff">日志 · 重启 · 回滚 · 停止</text>
      </g>
      <g opacity="0.92">
        <text x="278" y="646" fill="#e3e6f3">site-web</text>
        <text x="500" y="646" fill="#adb0bc">node-next</text>
        <text x="620" y="646" fill="#adb0bc" font-family="'JetBrains Mono',Menlo,monospace">3000</text>
        <circle cx="746" cy="642" r="4" fill="#8fd460"/>
        <text x="758" y="646" fill="#c0c2cf">运行中</text>
        <text x="900" y="646" fill="#3d8eff">日志 · 重启 · 回滚 · 停止</text>
      </g>
      <g opacity="0.88">
