        <text x="1160" y="318">6.8.0-45</text>
        <text x="1160" y="346">v1.1.8</text>
        <text x="1160" y="374">127.0.0.1:3210</text>
        <text x="1160" y="402">256 units</text>
        <text x="1160" y="430">今日 03:10</text>
      </g>
