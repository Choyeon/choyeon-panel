<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="choyeon-panel — 原生 Linux 服务器管理面板">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e27"/>
      <stop offset="1" stop-color="#242633"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx=".18" cy=".2" r=".8">
      <stop offset="0" stop-color="#005eeb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#005eeb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005eeb"/>
      <stop offset="1" stop-color="#4c8ef1"/>
    </linearGradient>
    <linearGradient id="bn-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d8eff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <pattern id="bn-grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(20,20)">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bn-bg)"/>
  <rect width="1600" height="400" fill="url(#bn-grid)"/>
  <rect width="1600" height="400" fill="url(#bn-glow)"/>

  <!-- logo -->
  <g transform="translate(80,74) scale(1.02)">
    <rect width="128" height="128" rx="28" fill="url(#bn-mark)"/>
    <rect x="22" y="28" width="84" height="72" rx="10" fill="#08224f" fill-opacity=".42"/>
    <path d="M22 38a10 10 0 0 1 10-10h64a10 10 0 0 1 10 10v4H22z" fill="#fff" fill-opacity=".22"/>
    <circle cx="32" cy="35" r="2.6" fill="#fff" fill-opacity=".9"/>
    <circle cx="41" cy="35" r="2.6" fill="#fff" fill-opacity=".55"/>
    <circle cx="50" cy="35" r="2.6" fill="#fff" fill-opacity=".35"/>
    <rect x="22" y="42" width="20" height="58" fill="#fff" fill-opacity=".10"/>
    <rect x="27" y="50" width="10" height="3.6" rx="1.8" fill="#fff" fill-opacity=".8"/>
    <rect x="27" y="59" width="10" height="3.6" rx="1.8" fill="#fff" fill-opacity=".4"/>
    <rect x="27" y="68" width="10" height="3.6" rx="1.8" fill="#fff" fill-opacity=".28"/>
    <polyline points="49,86 58,73 67,79 76,63 86,70 98,55" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <circle cx="98" cy="55" r="3.6" fill="#8fd460"/>
  </g>

  <!-- 字标 -->
  <text x="236" y="150" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="70" font-weight="700" fill="#e3e6f3" letter-spacing="-1">
    choyeon<tspan fill="url(#bn-line)">-panel</tspan>
  </text>
  <text x="238" y="196" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="27" fill="#adb0bc">
    原生 Linux 服务器管理面板 · 一台机器一个入口，不依赖 Docker
  </text>

  <!-- 特性 chips -->
  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="19" fill="#c0c2cf">
    <g transform="translate(238,228)">
      <rect width="156" height="40" rx="20" fill="#fff" fill-opacity=".06" stroke="#5b5e6a"/>
      <text x="18" y="26">应用一键部署</text>
    </g>
    <g transform="translate(408,228)">
      <rect width="158" height="40" rx="20" fill="#fff" fill-opacity=".06" stroke="#5b5e6a"/>
      <text x="18" y="26">systemd 直管</text>
    </g>
    <g transform="translate(580,228)">
      <rect width="150" height="40" rx="20" fill="#fff" fill-opacity=".06" stroke="#5b5e6a"/>
      <text x="18" y="26">nginx + SSL</text>
    </g>
    <g transform="translate(744,228)">
      <rect width="156" height="40" rx="20" fill="#fff" fill-opacity=".06" stroke="#5b5e6a"/>
      <text x="18" y="26">备份自动回滚</text>
    </g>
    <g transform="translate(914,228)">
      <rect width="166" height="40" rx="20" fill="#fff" fill-opacity=".06" stroke="#5b5e6a"/>
      <text x="18" y="26">12 项安全自检</text>
    </g>
  </g>

  <text x="238" y="320" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="22" fill="#7faef5">
    $ bash scripts/install.sh
  </text>
  <text x="238" y="352" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="18" fill="#9597a4">
    装依赖 → 建 venv → 构建前端 → 渲染 unit → 健康检查，失败自动回滚
  </text>

  <!-- 右侧迷你面板 -->
  <g transform="translate(1150,64)">
    <rect width="400" height="272" rx="16" fill="#242633" stroke="#434552"/>
    <rect y="0" width="400" height="40" rx="16" fill="#fff" fill-opacity=".05"/>
    <text x="20" y="26" font-family="Inter, 'PingFang SC', system-ui, sans-serif" font-size="16" fill="#e3e6f3">概览</text>
    <text x="330" y="26" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6fdba4">healthy</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9597a4">
      <text x="20" y="76">CPU</text>
      <text x="20" y="112">内存</text>
      <text x="20" y="148">磁盘</text>
    </g>
    <g>
      <rect x="72" y="64" width="240" height="10" rx="5" fill="#fff" fill-opacity=".08"/>
      <rect x="72" y="64" width="92" height="10" rx="5" fill="#3d8eff"/>
      <rect x="72" y="100" width="240" height="10" rx="5" fill="#fff" fill-opacity=".08"/>
      <rect x="72" y="100" width="160" height="10" rx="5" fill="#9b7bff"/>
      <rect x="72" y="136" width="240" height="10" rx="5" fill="#fff" fill-opacity=".08"/>
      <rect x="72" y="136" width="120" height="10" rx="5" fill="#8fd460"/>
    </g>
    <polyline points="20,232 62,214 104,222 146,196 188,206 230,180 272,190 314,166 356,176" fill="none" stroke="#3d8eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="262" font-family="Inter, 'PingFang SC', system-ui, sans-serif" font-size="13" fill="#9597a4">24h 网速 / 负载 / 磁盘 IO 历史曲线</text>
    <g transform="translate(330,58)">
      <rect width="52" height="20" rx="10" fill="#6fdba4" fill-opacity=".18"/>
      <text x="10" y="15" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6fdba4">运行</text>
    </g>
  </g>
</svg>
