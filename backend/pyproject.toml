[project]
name = "choyeon-panel-backend"
version = "1.1.10"
description = "choyeon 面板后端：FastAPI + SQLite，管理本机应用/服务/备份"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "PyJWT>=2.9",
    "psutil>=6.0",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# 测试夹具有意为之的形态，逐条 noqa 只会淹没测试正文：
# SIM115 故意持有 fd（模拟占用/泄漏场景）、SIM117 嵌套 arrange 更可读、
# B017 失败路径故意宽断言、B023 闭包在同一迭代内即被调用。
"tests/*" = ["E501", "SIM115", "SIM117", "B017", "B023"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
